[package]
name = "iced-bench"
version = "0.1.0"
edition = "2024"
publish = false
description = "The Mission Control test program of issue #8, in iced"

[dependencies]
# smol for the timers (time::every); the default thread pool has none.
iced = { version = "=0.14.0", features = ["smol"] }

[profile.release]
codegen-units = 1
lto = "thin"
