[workspace]
members = ["arbor", "mission"]
# `cargo build` and `cargo install --path arbor` build arbor alone; Mission Control needs GTK 4's development files.
default-members = ["arbor"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

# Small, fast binaries: the prototype is measured against the report's rows.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
