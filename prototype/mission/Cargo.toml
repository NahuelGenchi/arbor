[package]
name = "mission"
version = "0.1.0"
description = "Mission Control: the first window onto arbor's state, in GTK 4."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "arbor-mission"
path = "src/main.rs"

[dependencies]
arbor = { path = "../arbor" }
# GTK 4.14 or later to build (Ubuntu 24.04's); the look follows the desktop's light, dark and contrast settings from
# GTK 4.20 on.
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
libc = "0.2"
serde_json = "1"
