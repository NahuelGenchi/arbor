name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Reads the code and checks that it parses; measures nothing and needs no other permission.
permissions:
  contents: read

jobs:
  checks:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Run the source checks
        run: bash bench/check.sh
