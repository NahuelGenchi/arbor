name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Reads the code, checks that it parses and runs the prototype's tests; measures nothing and needs no other permission.
permissions:
  contents: read

jobs:
  checks:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Run the source checks
        run: bash bench/check.sh

  prototype:
    name: Prototype checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The end-to-end tests run commands in worlds through bubblewrap; without it they skip with a note.
      - name: Install bubblewrap
        run: sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
      - name: Install the pinned Rust toolchain
        working-directory: prototype
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt,clippy
      - name: Run the prototype's source checks
        run: bash prototype/check.sh
