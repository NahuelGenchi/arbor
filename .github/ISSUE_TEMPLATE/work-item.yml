name: Work item
description: Track a feature, bug, enhancement, document, research decision, or repository operation.
title: ""
body:
  - type: markdown
    attributes:
      value: |
        Every change needs an issue, a milestone, and a linked delivery PR. Reuse an existing issue when it already covers the work.
        Never include hostnames, personal paths, transcript contents, or account credentials.
  - type: dropdown
    id: work-type
    attributes:
      label: Work type
      options:
        - implementation
        - bug
        - enhancement
        - documentation
        - research
        - operations
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      description: Choose the outcome this work belongs to; use the sidebar for a deliberately created later milestone.
      options:
        - M0 — Project foundation
        - M1 — Measurements
        - M2 — Worlds and storage
        - M3 — Cells
        - M4 — Agent layer
        - M5 — Lean system
        - M6 — Outbox and ledger
      default: 1
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Goal and scope
      description: State the desired result, the exact files or parts of arbor involved, and what is out of scope. For bugs, include the machine, the command, what you expected, and what happened.
    validations:
      required: true
  - type: textarea
    id: completion
    attributes:
      label: Completion criteria
      description: Define the concrete deliverable and how it will be checked (source checks, a benchmark run, or review).
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Dependencies, evidence, and constraints
      description: Link related issues, sanitized logs, and primary sources. Name the CPU, RAM, distribution and kernel when a measurement depends on them.
      placeholder: "Dependencies: none known. Evidence: ... Constraints: ..."
    validations:
      required: true
